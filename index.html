<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./img/logo.png?v=1.1" type="image/png">
    <title>BYBLOS | Catálogo Digital</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/misEstilos.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg sticky-top custom-nav">
        <div class="container">
            <a class="navbar-brand logo-byblos" href="index.html">
                <img src="./img/logo.png" width="30" class="me-2" alt="Logo"> BYBLOS
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="#buscador">Buscador</a></li>
                    <li class="nav-item"><a class="nav-link" href="quienesomos.html">Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <header id="inicio" class="hero-section">
        <div class="container text-center">
            <div class="hero-content">
                <h1 class="display-2 main-title">El conocimiento te espera</h1>
                <p class="hero-tagline">Explora el catálogo literario más grande del mundo en un solo clic.</p>
                <a href="#buscador" class="btn btn-luxury mt-4">EMPEZAR LECTURA</a>
            </div>
        </div>
    </header>

    <main class="container">
        <section id="buscador" class="row justify-content-center section-padding">
            <div class="col-md-8 text-center">
                <h2 class="section-title">Buscador de Literatura Universal</h2>
                <div class="search-container mt-5">
                    <form id="frmBuscar">
                        <div class="input-group mb-3">
                            <input type="text" id="tituloLibro" class="form-control custom-input" placeholder="Escribe el título de la obra...">
                            <button type="submit" class="btn btn-luxury">BUSCAR</button>
                        </div>
                    </form>
                </div>
            </div>
        </section>

        <div id="resultado" class="row justify-content-center mb-5"></div>
    </main>

    <footer class="py-4 text-center">
        <p class="text-muted">
            <small>&copy; 2026 Byblos. Primer Parcial. Programación Para Internet. Todos los derechos reservados.</small>
        </p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Espero a que cargue todo antes de hacer cualquier cosa
        $(document).ready(function(){

            // Cuando el usuario envía el formulario
            $("#frmBuscar").submit(function(e){

                e.preventDefault(); // Evito que se recargue la página

                var query = $("#tituloLibro").val(); // Guardo lo que escribió

                // Mensaje mientras se hace la consulta
                $("#resultado").html('<div class="col-12 text-center"><h4>Consultando los estantes digitales...</h4></div>');

                // Hago la petición a la API
                $.ajax({
                    url: "https://openlibrary.org/search.json?title=" + query + "&limit=1",
                    method: "GET",
                    success: function(res){

                        // Verifico que sí haya resultados
                        if(res.docs.length > 0){

                            var libro = res.docs[0]; // Tomo el primero
                            var titulo = libro.title;
                            var autor = libro.author_name ? libro.author_name[0] : "Autor Desconocido"; // Por si no viene autor
                            var anio = libro.first_publish_year ? libro.first_publish_year : "N/A";
                            var idiomas = libro.language ? libro.language.slice(0,3).join(", ").toUpperCase() : "N/A";

                            // Si tiene portada la uso, si no pongo una genérica
                            var foto = libro.cover_i 
                                ? "https://covers.openlibrary.org/b/id/" + libro.cover_i + "-L.jpg" 
                                : "https://via.placeholder.com/300x450?text=Sin+Portada";

                            var linkOpenLibrary = "https://openlibrary.org" + libro.key;

                            // Aquí construyo la tarjeta con la información
                            $("#resultado").html(
                                '<div class="col-md-10 card-result shadow-lg">' +
                                    '<div class="row g-0 align-items-center">' +
                                        '<div class="col-md-4 p-4 text-center">' +
                                            '<img src="' + foto + '" class="img-fluid book-cover">' +
                                        '</div>' +
                                        '<div class="col-md-8 p-5">' +
                                            '<h2 class="book-title-result">' + titulo + '</h2>' +
                                            '<p class="book-info"><strong>AUTOR:</strong> ' + autor + '</p>' +
                                            '<p class="book-info"><strong>PRIMERA PUBLICACIÓN:</strong> ' + anio + '</p>' +
                                            '<p class="book-info"><strong>IDIOMAS DISPONIBLES:</strong> ' + idiomas + '</p>' +
                                            '<hr class="my-4">' +
                                            '<p class="mb-2" style="font-size: 0.9rem; color: #666;">Consulta la sinopsis completa, algunas reseñas y descubre dónde puedes comprarlo:</p>' +
                                            '<a href="' + linkOpenLibrary + '" target="_blank" class="btn btn-luxury px-5">ver más información</a>' +
                                        '</div>' +
                                    '</div>' +
                                '</div>'
                            );

                        } else {
                            // Si no encontró nada
                            $("#resultado").html("<h3 class='text-center mt-5'>No hemos encontrado esa obra.</h3>");
                        }
                    },
                    error: function(){
                        // Si falla la conexión
                        $("#resultado").html("<h3 class='text-center text-danger mt-5'>Error de conexión al servidor.</h3>");
                    }
                });
            });
        });
    </script>
</body>
</html>
